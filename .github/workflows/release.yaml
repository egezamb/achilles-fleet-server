name: Release

# On a tag vX.Y.Z: pushes the image and the chart to GitHub Container Registry
# and signs both with keyless cosign. The tag must match the chart's
# appVersion, so the chart's default image tag exists.
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/achilles-fleet-server
  CHARTS: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write
      id-token: write # keyless cosign signing through GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the chart's appVersion
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          app=$(sed -nE 's/^appVersion: *"?([^"]*)"?/\1/p' charts/achilles-fleet-server/Chart.yaml)
          test "v$app" = "$TAG" || { echo "tag $TAG but appVersion $app"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.app }}
          provenance: true
          sbom: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push the chart
        id: chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin
          helm package charts/achilles-fleet-server --destination dist
          helm push dist/achilles-fleet-server-*.tgz "oci://$CHARTS" 2>&1 | tee push.log
          digest=$(sed -nE 's/^Digest: *//p' push.log)
          test -n "$digest" || { echo "helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless: the signature names this workflow and commit, recorded in Sigstore's public log.
      - name: Sign the image and the chart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$CHARTS/achilles-fleet-server@$CHART_DIGEST"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          APP: ${{ steps.version.outputs.app }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          gh release create "$TAG" dist/achilles-fleet-server-*.tgz --verify-tag --title "$TAG" \
            --notes "Image: \`$IMAGE:$APP\` (\`$IMAGE_DIGEST\`). Chart: \`oci://$CHARTS/achilles-fleet-server\` (\`$CHART_DIGEST\`). Both signed with keyless cosign."
