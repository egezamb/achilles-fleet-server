name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test -race -count=1 ./...

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - run: helm lint --strict charts/achilles-fleet-server

      - name: Validate rendered manifests
        run: |
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
          # The oldest Kubernetes in kubeVersion and the newest kubeconform has schemas for.
          for k8s in 1.29.0 1.34.0; do
            for set in "" "networkPolicy.enabled=true,ingress.enabled=true,vdb.enabled=true,vdb.configMap.name=snapshot,persistence.enabled=false"; do
              echo "::group::kubeconform $k8s ${set:-defaults}"
              helm template ci charts/achilles-fleet-server --kube-version "$k8s" ${set:+--set "$set"} \
                | ./kubeconform -strict -summary -kubernetes-version "$k8s"
              echo "::endgroup::"
            done
          done

  # Builds the image from this commit and installs the chart with it on kind:
  # helm test, an upgrade, and an uninstall and reinstall that must keep the
  # report token, since enrolled devices hold a copy of it.
  install:
    needs: [go, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind

      - name: Build and load the image
        run: |
          docker build -t ghcr.io/egezamb/achilles-fleet-server:ci .
          kind load docker-image ghcr.io/egezamb/achilles-fleet-server:ci

      - name: Install, test, upgrade, reinstall
        run: |
          set -euo pipefail
          args=(charts/achilles-fleet-server -n fleet --set image.tag=ci --set image.pullPolicy=Never --set networkPolicy.enabled=true --wait --timeout 3m)
          token() { kubectl -n fleet get secret fleet-achilles-fleet-server -o jsonpath='{.data.report-token}' | base64 -d; }
          helm install fleet "${args[@]}" --create-namespace
          helm test fleet -n fleet --logs
          first=$(token)
          helm upgrade fleet "${args[@]}" --set resources.limits.memory=300Mi
          test "$(token)" = "$first" || { echo "report token changed on upgrade"; exit 1; }
          helm uninstall fleet -n fleet --wait
          helm install fleet "${args[@]}"
          test "$(token)" = "$first" || { echo "report token changed on reinstall"; exit 1; }
          helm test fleet -n fleet --logs

      - name: Show the pods on failure
        if: failure()
        run: kubectl -n fleet describe pods; kubectl -n fleet logs deploy/fleet-achilles-fleet-server --tail=100 || true
