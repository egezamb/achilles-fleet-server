apiVersion: v1
kind: Service
metadata:
  name: {{ include "afs.fullname" . }}
  labels:
    {{- include "afs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "afs.selectorLabels" . | nindent 4 }}
