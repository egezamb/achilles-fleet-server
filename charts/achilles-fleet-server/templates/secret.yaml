{{- if not .Values.tokens.existingSecret }}
{{- /*
A token is, in order: the value given in values, the one already in the
cluster, or a new random one. Reusing the cluster's copy keeps enrolled
devices working across upgrades; the keep policy keeps the Secret, and so the
tokens, across an uninstall and reinstall of the same release.
*/}}
{{- $name := include "afs.fullname" . }}
{{- $old := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "afs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  report-token: {{ with .Values.tokens.reportToken }}{{ b64enc . }}{{ else }}{{ get $old "report-token" | default (randAlphaNum 40 | b64enc) }}{{ end }}
  {{- with .Values.tokens.vdbToken }}
  vdb-token: {{ b64enc . }}
  {{- end }}
  {{- if .Values.readApi.enabled }}
  read-token: {{ with .Values.tokens.readToken }}{{ b64enc . }}{{ else }}{{ get $old "read-token" | default (randAlphaNum 40 | b64enc) }}{{ end }}
  {{- end }}
{{- end }}
