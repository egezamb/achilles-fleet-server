{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "afs.fullname" . }}
  labels:
    {{- include "afs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "afs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if include "afs.vdbFromOSV" . }}
  # Building the snapshot needs DNS and HTTPS to api.osv.dev, whose
  # addresses are not fixed, so HTTPS is allowed to any destination.
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
  {{- else }}
  # The server only answers; it opens no connections of its own.
  egress: []
  {{- end }}
{{- end }}
